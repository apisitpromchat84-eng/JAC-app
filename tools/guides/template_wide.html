<!doctype html><html lang="th"><head><meta charset="utf-8"><style>
* { box-sizing: border-box; margin: 0 }
body { background: #ccc; font-family: 'Loma', 'Noto Sans CJK JP', sans-serif; color: #1D2B3A }
.card { width: 1080px; height: 1350px; background: #F2F3EE; position: relative; overflow: hidden; padding: 54px 56px }
.top { display: flex; align-items: center; gap: 20px; margin-bottom: 28px }
.logo { width: 96px; height: 96px; border-radius: 26px; background: #F5B800; display: grid; place-items: center; font-size: 54px; box-shadow: 0 6px 0 #B98A00; flex: none }
.t2 { font-size: 60px; font-weight: 800; line-height: 1.12 } .pill { display: inline-block; background: #E5484D; color: #fff; border-radius: 999px; padding: 6px 22px; font-size: 30px; font-weight: 800 }
.row { display: flex; gap: 30px; align-items: flex-start }
.steps { flex: 1; display: grid; gap: 28px; font-size: 40px; line-height: 1.38 }
.step { display: flex; gap: 16px } .n { flex: none; width: 60px; height: 60px; border-radius: 18px; background: #F5B800; display: grid; place-items: center; font-weight: 800; font-size: 36px; box-shadow: 0 4px 0 #B98A00 }
.wide { width:100%; border-radius:28px; overflow:hidden; border:6px solid #1D2B3A; margin-top:34px; box-shadow:0 16px 40px rgba(0,0,0,.18) } .wide img{ display:block; width:100% }
.phone { flex: none; width: 420px; height: 818px; border-radius: 34px; overflow: hidden; border: 8px solid #1D2B3A; background: #fff; box-shadow: 0 16px 40px rgba(0,0,0,.18) }
.phone img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 0 }
.y { display: inline-block; width: 10px; height: 46px; background: #F5B800; border-radius: 4px; vertical-align: -8px; margin: 0 6px }
.foot { position: absolute; left: 56px; right: 56px; bottom: 38px; display: flex; justify-content: space-between; color: #8A97A3; font-size: 28px }
</style></head><body>
<div class="card" id="c0">
  <div class="top"><div class="logo">📈</div><div><span class="pill">แก้แล้ว</span><div class="t2">ทดสอบย่อย นับข้อที่ทำแล้ว</div></div></div>
  <div class="steps">
    <div class="step"><span class="n">1</span><div>แท็บ <b>ฝึก</b> › ทดสอบย่อย<br>ทำไป 10 ข้อ ก็ขึ้น <b>ทำแล้ว 10/25</b> ทันที</div></div>
    <div class="step"><span class="n">2</span><div>แถบ<b style="color:#C99700">เหลือง</b> = ทำแล้ว · แถบ<b style="color:#1F9D55">เขียว</b> = กด <b>มั่นใจ</b> แล้วตอบถูก</div></div>
  </div>
  <div class="wide"><img src="mini.png"></div>
  <div class="foot"><span>แอป JAC · 13 ต.ค. 2026</span><span>1/1</span></div>
</div>
</body></html>
